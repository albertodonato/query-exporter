name: Docker image

on:
  push:
    branches:
      - main
      - next
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-base:
    name: Build image (base)
    if: github.actor == github.repository_owner
    uses: albertodonato/github-workflows/.github/workflows/docker-build-publish.yaml@a4408e8a75803a35797a972f85c71382d5618e0f # v0.0.7
    with:
      image-name: ${{ github.repository }}
      suffix: base
      target: base
      dockerhub-image-name: query-exporter
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  build-full:
    name: Build image (full)
    if: github.actor == github.repository_owner
    uses: albertodonato/github-workflows/.github/workflows/docker-build-publish.yaml@a4408e8a75803a35797a972f85c71382d5618e0f # v0.0.7
    needs:
      - build-base
    with:
      image-name: ${{ github.repository }}
      target: full
      dockerhub-image-name: query-exporter
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      platforms: linux/amd64,linux/arm64
    secrets: inherit
