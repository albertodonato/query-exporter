name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    uses: albertodonato/github-workflows/.github/workflows/run-tox.yaml@a4408e8a75803a35797a972f85c71382d5618e0f # v0.0.7
    with:
      python-version: "3.15"
      tox-env: lint

  check:
    name: Check
    uses: albertodonato/github-workflows/.github/workflows/run-tox.yaml@a4408e8a75803a35797a972f85c71382d5618e0f # v0.0.7
    with:
      python-version: ${{ matrix.python-version }}
      tox-env: check

    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

  test:
    name: Unit tests
    uses: albertodonato/github-workflows/.github/workflows/run-tox.yaml@a4408e8a75803a35797a972f85c71382d5618e0f # v0.0.7
    with:
      python-version: ${{ matrix.python-version }}
      tox-env: py

    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

  integration-test:
    name: Integration tests
    uses: albertodonato/github-workflows/.github/workflows/run-tox.yaml@a4408e8a75803a35797a972f85c71382d5618e0f # v0.0.7
    with:
      python-version: "3.15"
      tox-env: integration-tests
      env-args: -vv --db=${{ matrix.database }}

    strategy:
      matrix:
        database:
          - mssql
          - mysql
          - oracle
          - postgresql
      fail-fast: false
